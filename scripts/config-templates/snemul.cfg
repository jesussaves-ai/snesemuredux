; SNEmulDS configuration template
;
; Copy this file next to SNEmulDS.nds (or into the folder holding your ROMs)
; and name it "snemul.cfg".  Keys are read by readOptionsFromConfig()
; (arm9/source/main.c).  Values shown are the built-in defaults.
;
; Per-game overrides may be placed in a "[<ROM title>]" section; settings in
; that section take precedence over the "[Global]" section.

[Global]

; Directory the ROM selector opens at ("ROMPath").
ROMPath ./

; --- Screen / scaling ---------------------------------------------------
; YScroll: 0 = HUD only, 1 = full, 2 = none, 3 = light.
YScroll    0
; Scaled: 0 = 1:1 (240 lines), 1 = half scaling, 2 = full screen.
Scaled     0
; Bilinear: 1 = enable the vertical-scale bi-linear dithering (removes seams
; on the scaled modes); 0 = disable (sharper, but may show scale seams).
Bilinear  1

; --- Audio --------------------------------------------------------------
; Sound: 1 = APU/SPC emulation enabled.
Sound      1

; --- Layers / priorities ------------------------------------------------
; BGLayers: octal mask, one digit per SNES BG1..BG4 (1 = visible).
BGLayers   010111
; LayerPreset: human-readable automatic layer ordering preset (preferred) --
;   BG1>BG2>BG3>BG4 | BG3>BG1>BG2>BG4 | BG3 front, rest low |
;   All equal | All mid (2) | All high (1) | All top (0) |
;   BG3>BG4>BG1>BG2 | BG2>BG4>BG1>BG3 | BG3>BG2>BG1>BG4
LayerPreset BG1>BG2>BG3>BG4
; Structured per-layer priorities (0 = front .. 3 = back).
BG1Pr 0
BG2Pr 1
BG3Pr 2
BG4Pr 3
; Structured per-sprite priority band (0..3).
Spr1Pr 3
Spr2Pr 2
Spr3Pr 1
Spr4Pr 1
; TilePriorityBG: -1 = off, or 0..3 = split that SNES BG into two priority
; layers (per-tile priority).
TilePriorityBG -1

; --- Hacks --------------------------------------------------------------
; Block priority for BG3 / blank-tile workaround.
BG3TilePriority 0
BlankTileNumber 0

; --- Misc ---------------------------------------------------------------
HDMA         1
EnableSRAM   1
WaitVBlank   0
FastDMA      1
Transparency 1
